[project]
name = "tts-app"
version = "0.1.0"
description = "Local, offline text-to-speech audiobook builder (txt/md/pdf -> MP3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlx-audio>=0.5.0",
    "misaki>=0.9.0",
    "spacy",
    "num2words",
    "phonemizer-fork",
    "espeakng-loader",
    "numpy>=1.26",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "markdown-it-py>=3.0",
]

[project.scripts]
tts = "tts_app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tts_app"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["tts_app"]

[[tool.mypy.overrides]]
module = [
    "fitz",
    "fitz.*",
    "pymupdf",
    "pymupdf.*",
    "mlx_audio",
    "mlx_audio.*",
    "mlx",
    "mlx.*",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tts_app/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
